<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>如如的創意料理 — 管理後台登入</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --dark: #1a1208;
      --cream: #faf6ef;
      --warm: #f0e8d8;
      --muted: #8a7a65;
      --error: #c0392b;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-header .tag {
      display: inline-block;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      padding: 5px 16px;
      border-radius: 2px;
      margin-bottom: 16px;
    }

    .login-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 400;
      color: #fff;
      margin-bottom: 6px;
    }

    .login-header p {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.06em;
    }

    .login-card {
      background: var(--cream);
      border-radius: 4px;
      padding: 36px 32px 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e8e0d4;
      border-radius: 3px;
      font-size: 0.92rem;
      color: var(--dark);
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
      font-family: 'Inter', sans-serif;
    }

    .form-group input:focus { border-color: var(--gold); }
    .form-group input.error { border-color: var(--error); }

    .error-banner {
      background: #fdf0ee;
      border: 1px solid #e8b4ae;
      border-radius: 3px;
      color: var(--error);
      font-size: 0.8rem;
      padding: 10px 14px;
      margin-bottom: 18px;
      display: none;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--dark);
      color: #fff;
      border: none;
      border-radius: 3px;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: background 0.2s, opacity 0.2s;
      margin-top: 4px;
    }

    .submit-btn:hover:not(:disabled) { background: #2e2010; }
    .submit-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

<div class="login-wrap">
  <div class="login-header">
    <div class="tag">Admin Portal</div>
    <h1>管理後台</h1>
    <p>如如的創意料理 · 員工專用</p>
  </div>

  <div class="login-card">
    <div class="error-banner" id="error-banner"></div>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label>管理員 Email</label>
        <input type="email" id="f-email" placeholder="admin@example.com" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>密碼</label>
        <input type="password" id="f-password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <button type="submit" class="submit-btn" id="login-btn">登入</button>
    </form>
  </div>

  <div class="login-footer">© 2025 Cuisine Créative de Ruru</div>
</div>

<script>
  const API_BASE = '';

  // 1.3 JWT 存取控制整合在每頁 script 頂部：已登入則跳轉儀表板
  (function checkAuth() {
    if (sessionStorage.getItem('accessToken')) {
      location.replace('dashboard.html');
    }
  })();

  const banner = document.getElementById('error-banner');

  function showError(msg) {
    banner.textContent = msg;
    banner.style.display = 'block';
  }

  function hideError() {
    banner.style.display = 'none';
  }

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    hideError();

    const email = document.getElementById('f-email').value.trim();
    const password = document.getElementById('f-password').value;

    if (!email || !password) {
      showError('請輸入 Email 與密碼');
      return;
    }

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = '登入中…';

    try {
      const res = await fetch(`${API_BASE}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json();

      if (!res.ok) {
        showError('帳號或密碼錯誤');
        return;
      }

      sessionStorage.setItem('accessToken', data.accessToken);
      location.replace('dashboard.html');
    } catch (err) {
      showError('無法連線到伺服器，請確認 API 是否啟動（localhost:3000）');
    } finally {
      btn.disabled = false;
      btn.textContent = '登入';
    }
  });
</script>
</body>
</html>
